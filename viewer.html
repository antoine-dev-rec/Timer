<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrono</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;color:#fff;font-family:system-ui,"Segoe UI",sans-serif}
#t{font-weight:600;margin-bottom:2vh;max-width:94%}
#d{line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
#m{white-space:pre-wrap;max-width:90%;margin-top:3vh;line-height:1.3}
#o{position:fixed;right:10px;bottom:8px;font-size:12px;color:#c33;display:none}
</style>
</head>
<body>
<div id="t"></div><div id="d">--:--</div><div id="m"></div><div id="o">Connexion perdue</div>
<script>
var st=null, ok=false;
function $(i){ return document.getElementById(i); }
function poll(){
  fetch('/api/state',{cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(j){ st=j; ok=true; draw(); })
    .catch(function(){ ok=false; draw(); });
}
function draw(){
  $('o').style.display = ok ? 'none' : 'block';
  if(!st) return;
  var bg = st.bgColor==='transparent' ? '#000' : st.bgColor;
  document.body.style.background = bg; document.body.style.color = st.fgColor;
  var d=$('d'), n=st.text.length;
  d.textContent = st.text; d.style.fontFamily = st.font; d.style.fontWeight = st.fw;
  d.style.fontSize = Math.min(innerWidth*0.92/(n*0.6), innerHeight*0.5) + 'px';
  $('t').textContent = st.title || ''; $('t').style.fontSize = Math.max(14, innerWidth*0.05) + 'px'; $('t').style.color = '#9aa3b2';
  $('m').textContent = st.messageVisible ? st.message : ''; $('m').style.fontSize = Math.max(14, innerWidth*0.035) + 'px';
}
setInterval(poll, 250); poll(); addEventListener('resize', draw);
</script>
</body>
</html>
