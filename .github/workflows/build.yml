name: Construire exe et module Companion
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chrono-evenement-V2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Chrono-Evenement-exe
          path: chrono-evenement-V2/dist/*.exe
  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrono-evenement-V2/companion-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Module-Companion
          path: chrono-evenement-V2/companion-module/*.tgz
  publier:
    needs: [exe, companion]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
      - uses: softprops/action-gh-release@v2
        with:
          files: fichiers/**/*
